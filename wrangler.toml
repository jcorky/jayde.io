# Cloudflare Pages project config. The static site is built by `npm run build`
# into dist/; the contact endpoint (functions/api/contact.ts) runs as a Pages
# Function. Email delivery goes through the jayde-io-mailer Worker via the MAILER
# service binding below. Secrets (TURNSTILE_SECRET_KEY, MAILER_KEY) are NOT here —
# set them with `wrangler pages secret put NAME --project-name jaydeio`.
name = "jaydeio"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[services]]
binding = "MAILER"
service = "jayde-io-mailer"

[vars]
ALLOWED_HOSTNAMES = "jayde.io,www.jayde.io,jaydeio.pages.dev"
